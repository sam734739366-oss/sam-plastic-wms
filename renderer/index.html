<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>سام بلاستيك — تسجيل الدخول</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4l1 3v4l4.5 10.5A1.8 1.8 0 0 1 17.8 22H6.2a1.8 1.8 0 0 1-1.7-2.5L9 9V5l1-3z"/><path d="M10 2h4"/><path d="M9 13h6"/></svg></div>
    <h1>سام بلاستيك</h1>
    <p class="subtitle">نظام إدارة مصنع نفخ العبوات البلاستيكية</p>
    <form id="login-form">
      <label>اسم المستخدم <input id="username" autocomplete="username" required></label>
      <label>كلمة المرور <input id="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error hidden">اسم المستخدم أو كلمة المرور غير صحيحة</p>
      <button type="submit" class="btn primary">دخول</button>
    </form>
  </div>
<script type="module" src="js/login.js"></script>
</body>
</html>
