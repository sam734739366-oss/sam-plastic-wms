<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>طباعة</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: #f0f2f5; }
    #toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: linear-gradient(135deg, #1e3a8a, #3450b8); color: #fff; position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
    #toolbar h2 { margin: 0; font-size: 15px; flex: 1; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 22px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button.close { background: #6c757d; }
    iframe { border: none; position: fixed; top: 48px; left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - 48px); background: #fff; }
  </style>
</head>
<body>
  <div id="toolbar">
    <h2 id="docTitle">معاينة الطباعة</h2>
    <button id="btnPrint">طباعة</button>
    <button id="btnClose" class="close">إغلاق</button>
  </div>
  <iframe id="frame"></iframe>
  <script src="print.js"></script>
</body>
</html>
